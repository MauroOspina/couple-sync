name: EAS Update (OTA)

on:
  push:
    branches:
      - main
      - preview

jobs:
  update:
    name: Publicar actualización OTA
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout del código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: 📦 Instalar dependencias
        run: npm install

      - name: ✅ Verificar (lint, tipos y tests)
        run: npm run check

      - name: 🚀 Configurar EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # El mensaje del commit va por variable de entorno (no dentro del comando): así sus comillas
      # o saltos de línea no rompen el shell ni pueden inyectar comandos. Se usa solo la primera línea.
      - name: 📲 Publicar a Canal Production (main)
        if: github.ref == 'refs/heads/main'
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: npx eas-cli@latest update --channel production --environment production --platform android --message "$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)"

      - name: 🧪 Publicar a Canal Preview
        if: github.ref == 'refs/heads/preview'
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: npx eas-cli@latest update --channel preview --environment preview --platform android --message "$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)"
